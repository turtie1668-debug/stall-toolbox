<style>
/* ===== tokens (same palette as 商品型錄工具: monochrome, hairlines, thick black rules) ===== */
:root{
  --bg:#fff; --bg2:#f5f5f2; --text:#111; --muted:#6a6a66; --line:#e3e3df; --ink:#111; --desk:#e6e6e1;
  --f-display:"Jost","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC",system-ui,sans-serif;
  --hatch:repeating-linear-gradient(135deg,#111 0 2.4mm,#fff 2.4mm 4.8mm);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #111;outline-offset:2px}
[hidden]{display:none!important}

/* ===== app shell ===== */
.app{display:grid;grid-template-columns:420px minmax(0,1fr);height:100%}
.ui{background:#fff;border-right:3px solid #111;display:flex;flex-direction:column;min-height:0}
.ui-h{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:3px solid #111}
.ui-h .lg{width:30px}
.ui-h b{font:700 1rem var(--f-display);letter-spacing:.04em}
.ui-h small{display:block;font:500 .68rem var(--f-display);letter-spacing:.2em;color:var(--muted)}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-bottom:3px solid transparent;background:none;padding:10px 4px;font:700 .8rem var(--f-display);letter-spacing:.12em;color:var(--muted);cursor:pointer}
.tabs button.on{color:#111;border-bottom-color:#111}
.pane{flex:1;min-height:0;overflow:auto;padding:16px}
.status{flex:none;padding:6px 16px;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#111;color:#fff;border:2px solid #111;padding:7px 14px;font:700 .76rem var(--f-display);letter-spacing:.12em;cursor:pointer;text-decoration:none}
.btn:hover{background:#fff;color:#111}
.btn.ghost{background:#fff;color:#111}
.btn.ghost:hover{background:#111;color:#fff}
.btn.sm{padding:3px 9px;font-size:.7rem;letter-spacing:.06em}
.btn.warn{border-color:#111;background:#fff;color:#111;border-style:dashed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.hd{font:700 .78rem var(--f-display);letter-spacing:.2em;text-transform:uppercase;border-bottom:3px solid #111;padding-bottom:3px;margin:18px 0 10px}
.hd:first-child{margin-top:0}
.note{font-size:.78rem;color:var(--muted);margin:4px 0 10px}
.lnote{background:var(--bg2);padding:6px 9px;border-left:3px solid #111}

label.f{display:block;margin:0 0 10px}
label.f>span{display:block;font-size:.76rem;color:var(--muted);margin-bottom:3px}
.f input[type=text],.f input[type=number],.f input[type=url],.f input[type=date],.f select,.f textarea,.search,.fsel{width:100%;border:1px solid #cfcfca;background:#fff;padding:7px 9px;border-radius:0}
.f textarea{min-height:72px;resize:vertical;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus,.search:focus{border-color:#111;outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:.86rem;cursor:pointer}
.chk input{accent-color:#111;width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips label{display:inline-flex;align-items:center;gap:5px;border:1px solid #cfcfca;padding:4px 9px;font-size:.8rem;cursor:pointer;user-select:none}
.chips label:has(input:checked){background:#111;color:#fff;border-color:#111}
.chips input{display:none}

/* product list */
.tools{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:6px}
.plist{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.plist li{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.plist li:hover{background:var(--bg2)}
.plist li.cur{background:var(--bg2);box-shadow:inset 3px 0 0 #111}
.plist .th{width:40px;height:40px;background:var(--bg2);display:grid;place-items:center;overflow:hidden;color:#b7b7b1;border:1px solid var(--line);cursor:pointer}
.plist .th img{width:100%;height:100%;object-fit:cover}
.plist .th svg{width:24px;height:24px}
.plist .nm{min-width:0;cursor:pointer}
.plist b{display:block;font-weight:500;font-size:.88rem;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .m{font-size:.72rem;color:var(--muted)}
.plist input[type=checkbox]{accent-color:#111;width:17px;height:17px;margin:0}
.plist li.off .nm,.plist li.off .th{opacity:.45}
.star{border:1.5px solid #111;background:#fff;font:700 .66rem var(--f-display);letter-spacing:.08em;padding:2px 6px;cursor:pointer;white-space:nowrap}
.star.on{background:#111;color:#fff}
.badge{display:inline-block;font:700 .62rem/1.5 var(--f-display);border:1.5px solid currentColor;padding:0 5px;margin-left:4px;letter-spacing:.06em}
.ed{border:2px solid #111;padding:12px;margin:8px 0 4px;background:#fff}
.ed .top{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:10px}
.ed .pv{width:72px;height:72px;background:var(--bg2);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);color:#b7b7b1}
.ed .pv img{width:100%;height:100%;object-fit:cover}
.ed .pv svg{width:50%}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid #111;margin-bottom:12px}
.sum div{padding:6px 8px;border-left:1px solid var(--line)}
.sum div:first-child{border-left:0}
.sum b{display:block;font:700 1.2rem/1.2 var(--f-display)}
.sum small{font-size:.68rem;color:var(--muted);letter-spacing:.1em}

/* layout picker */
.lpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.lpick button{border:1px solid #cfcfca;background:#fff;padding:8px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.lpick button:hover{border-color:#111}
.lpick button.on{border:2px solid #111;background:var(--bg2);padding:7px 5px 5px}
.lpick b{font-size:.78rem}
.lpick small{font-size:.64rem;color:var(--muted);text-align:center;line-height:1.3}
.mini{width:44px;height:62px;border:1px solid #111;background:#fff;padding:3px;display:flex;flex-direction:column;gap:2px}
.mini i{display:block;background:#e3e3df}
.mini i.k{background:#111}
.links .lk{display:grid;grid-template-columns:90px minmax(0,1fr) 28px;gap:6px;margin-bottom:6px}
.links input{border:1px solid #cfcfca;padding:6px 8px;min-width:0}
.links button{border:1px solid #cfcfca;background:#fff;cursor:pointer}

/* preview */
.view{display:flex;flex-direction:column;min-height:0;min-width:0}
.vbar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid #cfcfca}
.vbar .cnt{font:700 .82rem var(--f-display);letter-spacing:.1em}
.vbar .cnt span{color:var(--muted);font-weight:500}
.vbar select{border:1px solid #cfcfca;padding:5px 8px;background:#fff}
#preview{flex:1;min-height:0;overflow:auto;padding:28px 24px 60px}
#sheets{margin:0 auto;width:max-content;transform-origin:top center}

@media(max-width:960px){
  .app{grid-template-columns:1fr;height:auto}
  .ui{border-right:0;border-bottom:3px solid #111}
  .pane{overflow:visible}
}

/* ===================================================================
   SHEETS — designed on A5 (148×210 mm) and scaled for A4 / A6
   (ISO A sizes share the same ratio, so the layout stays identical)
   =================================================================== */
.sheet{position:relative;background:#fff;margin:0 auto 10mm;box-shadow:0 0 0 1px #c9c9c4;overflow:hidden}
.sheet.a5{width:148mm;height:210mm}
.sheet.a4{width:210mm;height:297mm}
.sheet>.page{position:absolute;left:0;top:0;transform-origin:0 0}
.sheet.a4>.page{transform:scale(1.41892)}
.sheet.imp{width:210mm;height:297mm}
.sheet.imp .cell{position:absolute;width:105mm;height:148.5mm;overflow:hidden}
.sheet.imp .cell .page{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(.70946)}
.sheet.imp .cell:nth-child(1){left:0;top:0}.sheet.imp .cell:nth-child(2){left:105mm;top:0}
.sheet.imp .cell:nth-child(3){left:0;top:148.5mm}.sheet.imp .cell:nth-child(4){left:105mm;top:148.5mm}
.sheet.imp::before,.sheet.imp::after{content:"";position:absolute;z-index:2;pointer-events:none}
.sheet.imp::before{left:105mm;top:0;bottom:0;border-left:.2mm dashed #9a9a96}
.sheet.imp::after{top:148.5mm;left:0;right:0;border-top:.2mm dashed #9a9a96}

.lg.w{background:#fff}
img.lgi{display:block;flex:none;width:9mm;height:9mm;object-fit:contain}
.ico{fill:currentColor}

/* head */
.dhd{flex:none;margin:0 8mm;height:13mm;display:flex;align-items:flex-end;gap:2.4mm;padding-bottom:2mm;border-bottom:.8mm solid #111}
.dhd .lg,.dhd .lgi{width:7mm;height:auto}
.dhd img.lgi{height:7mm}
.dhd .br{line-height:1.2}
.dhd .br b{display:block;font:700 8pt var(--f-body)}
.dhd .br small{font:500 5.6pt var(--f-display);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.dhd .ct{margin-left:auto;display:flex;align-items:center;gap:2mm;font:500 5.6pt var(--f-display);letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.dhd .ct b{background:#111;color:#fff;padding:.3mm 2mm;font:700 6.4pt var(--f-body);letter-spacing:.06em}
.dbd{flex:1;min-height:0;display:flex;flex-direction:column;padding:4.5mm 8mm 3mm;gap:4mm}
.dft{flex:none;height:9mm;position:relative;display:flex;align-items:center;justify-content:space-between;padding:2.2mm 8mm 0;font:500 5.6pt var(--f-display);letter-spacing:.16em;color:var(--muted)}
.dft::before{content:"";position:absolute;left:0;right:0;top:0;height:2.2mm;background:var(--hatch)}
.dft b{font:700 7pt var(--f-display);color:#111;letter-spacing:.06em}

/* hero: event + booth tile */
.hero{flex:none;display:flex;gap:4mm;align-items:stretch}
.hero .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.hero .k{display:flex;align-items:center;gap:2.4mm;font:700 5.8pt var(--f-display);letter-spacing:.26em;text-transform:uppercase}
.hero .k i{width:7mm;height:1.2mm;background:#111;flex:none}
.hero h1{margin:1.2mm 0 0;font:900 17pt/1.18 var(--f-body);letter-spacing:.01em}
.hero .dt{margin-top:1.2mm;font:700 7.6pt var(--f-display);letter-spacing:.08em}
.hero .tl{margin-top:1mm;font-size:7.4pt;color:#3b3b38;white-space:pre-line}
.booth{position:relative;flex:none;width:30mm;min-height:30mm;background:#07070c;border:1.6mm solid #fff;box-shadow:0 0 0 .45mm #111;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:2.2mm 2.4mm}
.booth::after{content:"";position:absolute;inset:.9mm;border:.3mm solid rgba(255,255,255,.35);pointer-events:none}
.booth small{font:700 5.4pt var(--f-display);letter-spacing:.24em}
.booth b{font:700 17pt/1 var(--f-display);letter-spacing:.02em;word-break:break-all}
.booth b.l{font-size:12pt}
.booth em{font-style:normal;font:500 5.8pt/1.3 var(--f-body);color:#cfcfca}

/* featured */
.feat{flex:none;display:grid;gap:3mm}
.feat.n1{grid-template-columns:1fr}
.feat.n2{grid-template-columns:1fr 1fr}
.feat.n3{grid-template-columns:1fr 1fr 1fr}
.fc{position:relative;min-width:0;display:flex;flex-direction:column;border:.35mm solid #111}
.feat.n1 .fc{flex-direction:row}
.fc .img{position:relative;aspect-ratio:4/3;background:var(--bg2);overflow:hidden;display:grid;place-items:center;color:#b7b7b1}
.feat.n1 .fc .img{width:52mm;flex:none;aspect-ratio:1}
.fc .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc .img svg{width:40%;height:40%}
.fc .tg{position:absolute;left:1.4mm;top:1.4mm}
.fc .tx{padding:1.8mm 2mm 2mm;display:flex;flex-direction:column;gap:.6mm;min-width:0;flex:1}
.fc h3{margin:0;font:700 8pt/1.3 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc .hl{font-size:6.8pt;color:#3b3b38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feat.n1 .fc .hl{-webkit-line-clamp:6}
.fc .pr{margin-top:auto;display:flex;align-items:baseline;gap:1.6mm;flex-wrap:wrap}
.pr .now{font:700 11pt/1 var(--f-display)}
.pr .now small{font-size:6pt;margin-right:.4mm;font-weight:500}
.pr s{font:500 6.4pt var(--f-display);color:var(--muted)}
.pr .nt{font:700 5.6pt/1.6 var(--f-body);background:#111;color:#fff;padding:0 1.2mm}
.tg{display:inline-block;padding:0 1.4mm;font:700 5.6pt/1.7 var(--f-display);letter-spacing:.08em;border:.3mm solid #111;background:#fff;color:#111;white-space:nowrap}
.tg.on{background:#111;color:#fff}
.sold{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.sold span{transform:rotate(-12deg);border:.7mm solid #111;background:rgba(255,255,255,.88);padding:.6mm 3mm;font:900 13pt/1.2 var(--f-body);letter-spacing:.2em}

/* section title */
.st{flex:none;display:flex;align-items:baseline;gap:2.4mm;border-bottom:.6mm solid #111;padding-bottom:.8mm}
.st b{font:900 8.4pt var(--f-body)}
.st small{font:700 5.4pt var(--f-display);letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.st em{margin-left:auto;font-style:normal;font:500 5.6pt var(--f-display);color:var(--muted);letter-spacing:.1em}

/* price list (compact, 2 columns) */
.flow{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:0 5mm}
.flow.one{grid-template-columns:1fr}
.col{min-height:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:1.6mm;margin:1.8mm 0 .6mm;font:700 6pt var(--f-display);letter-spacing:.16em}
.ch:first-child{margin-top:.4mm}
.ch i{width:4.4mm;height:4.4mm;background:#111;color:#fff;display:grid;place-items:center;font:700 5.4pt var(--f-body);font-style:normal;flex:none}
.pl{display:flex;align-items:baseline;gap:1.2mm;padding:.75mm 0;border-bottom:.2mm solid var(--line)}
.pl .n{min-width:0;flex:0 1 auto;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .n small{font:500 5.2pt var(--f-display);color:var(--muted);margin-left:1mm;letter-spacing:.06em}
.pl .ld{flex:1;min-width:3mm;border-bottom:.3mm dotted #9a9a96;transform:translateY(-1mm)}
.pl .p{flex:none;font:700 7.6pt var(--f-display);white-space:nowrap}
.pl .p s{font-weight:500;color:var(--muted);font-size:5.8pt;margin-right:.8mm}
.pl .nt{flex:none;font:700 5pt/1.6 var(--f-body);background:#111;color:#fff;padding:0 1mm}
.pl.so .n,.pl.so .p{text-decoration:line-through;color:#9a9a96}
.pl.so .nt{background:#fff;color:#111;border:.25mm solid #111}

/* price list (rich rows with thumbnail) */
.pr2{display:grid;grid-template-columns:12mm minmax(0,1fr) auto;gap:2.4mm;align-items:center;padding:1.2mm 0;border-bottom:.2mm solid var(--line)}
.pr2 .th{width:12mm;height:12mm;background:var(--bg2);overflow:hidden;display:grid;place-items:center;color:#b7b7b1;position:relative}
.pr2 .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pr2 .th svg{width:60%;height:60%}
.pr2 b{display:block;font:700 7.6pt/1.3 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr2 .m{font:500 5.6pt var(--f-display);color:var(--muted);letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr2 .r{text-align:right}
.pr2 .r .now{font:700 9.4pt/1 var(--f-display)}
.pr2 .r s{display:block;font:500 5.6pt var(--f-display);color:var(--muted)}
.pr2 .r .nt{display:inline-block;margin-top:.6mm;font:700 5pt/1.6 var(--f-body);background:#111;color:#fff;padding:0 1mm}
.pr2.so b,.pr2.so .now{text-decoration:line-through;color:#9a9a96}

/* offer + info */
.offer{flex:none;display:flex;border:.5mm solid #111}
.offer .bar{width:4mm;background:var(--hatch);flex:none;border-right:.5mm solid #111}
.offer .bd{flex:1;padding:1.6mm 2.6mm;min-width:0}
.offer .bd b{font:900 7.6pt var(--f-body);margin-right:2mm}
.offer .bd small{font:700 5.2pt var(--f-display);letter-spacing:.22em;color:var(--muted)}
.offer ul{margin:.6mm 0 0;padding:0;list-style:none}
.offer li{display:flex;gap:1.6mm;font-size:7.2pt;font-weight:500}
.offer li::before{content:"";width:1.6mm;height:1.6mm;background:#111;flex:none;transform:translateY(1.4mm) rotate(45deg)}
.info{flex:none;display:flex;gap:3.5mm;align-items:flex-end}
.info .pay{flex:1;min-width:0}
.info .pay small,.qrs small{display:block;font:700 5.2pt var(--f-display);letter-spacing:.22em;color:var(--muted);margin-bottom:.8mm}
.info .pay div{display:flex;flex-wrap:wrap;gap:1mm}
.info .pay span{font:700 6pt/1.7 var(--f-body);border:.3mm solid #111;padding:0 1.6mm}
.info .ct{margin-top:1.6mm;font-size:6.4pt;color:#3b3b38;white-space:pre-line;line-height:1.5}
.qrs{flex:none;display:flex;gap:2.4mm}
.qrs figure{margin:0;width:17mm;text-align:center}
.qrs .qr{display:block;width:17mm;height:17mm;border:.3mm solid #111}
.qrs figcaption{font:700 5.2pt/1.3 var(--f-display);letter-spacing:.04em;margin-top:.6mm;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* poster */
.poster .dbd{gap:3.5mm}
.big{flex:none;display:flex;flex-direction:column;align-items:flex-start}
.big .k{display:flex;align-items:center;gap:2.4mm;font:700 6pt var(--f-display);letter-spacing:.3em;text-transform:uppercase}
.big .k i{width:9mm;height:1.4mm;background:#111}
.big h1{margin:1.6mm 0 0;font:900 25pt/1.12 var(--f-body)}
.big .dt{margin-top:1.4mm;font:700 8.4pt var(--f-display);letter-spacing:.1em}
.pbooth{flex:none;display:flex;align-items:stretch;border:.8mm solid #111}
.pbooth .l{background:#111;color:#fff;padding:2mm 3mm;display:flex;flex-direction:column;justify-content:center}
.pbooth .l small{font:700 5.6pt var(--f-display);letter-spacing:.28em}
.pbooth .l b{font:700 30pt/1 var(--f-display)}
.pbooth .r{flex:1;padding:2mm 3.4mm;display:flex;flex-direction:column;justify-content:center;min-width:0}
.pbooth .r b{font:900 11pt/1.3 var(--f-body)}
.pbooth .r span{font-size:7.2pt;color:#3b3b38;white-space:pre-line}
.phero{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.6mm}
.phero.n1{grid-template-columns:1fr}
.phero{grid-auto-rows:minmax(0,1fr)}
.phero.n3 .fc:first-child{grid-column:1/-1;flex-direction:row}
.phero.n3 .fc:first-child .img{width:55%;flex:none}
.phero.n3 .fc:first-child .tx{flex:1;justify-content:flex-end}
.phero .fc{min-height:0}
.phero .fc .img{aspect-ratio:auto;flex:1;min-height:0}
.phero.n1 .fc{flex-direction:column}
.phero.n1 .fc .img{width:auto}
.phero .fc .tx{flex:none}
.phero.n1 .fc h3{font-size:11pt}
.phero .fc .pr .now{font-size:13pt}
.poster .offer .bd b{font-size:9pt}
.poster .offer li{font-size:9pt}

/* ===================================================================
   PRODUCT CARDS — size set in mm, content scales with container units
   =================================================================== */
.csheet{position:relative;background:#fff;margin:0 auto 10mm;box-shadow:0 0 0 1px #c9c9c4;overflow:hidden}
.csheet .cg{position:absolute;display:grid}
.csheet .mk{position:absolute;background:#111}
.csheet .lab{position:absolute;font:500 2.2mm var(--f-display);letter-spacing:.14em;color:#9a9a96;white-space:nowrap}
.pc{position:relative;overflow:hidden;container:pc/size;font-family:"Noto Serif TC","Noto Sans TC",serif}
.pc .t{position:absolute;left:0;right:0;top:0;bottom:24%;overflow:hidden}
.pc .b{position:absolute;left:0;right:0;bottom:0;height:24%;display:flex;align-items:center;justify-content:space-between;gap:4cqw;padding:0 3cqw 0 7cqw}
.pc .lbl{position:absolute;left:7.5cqw;top:6cqh;font:500 5.6cqh/1.2 var(--f-body);letter-spacing:.04em;white-space:nowrap}
.pc .rule{position:absolute;left:2cqw;right:3.5cqw;top:16.5cqh;height:2.6cqh}
.pc .rule i{position:absolute;left:2.5cqw;right:3cqw;bottom:0;height:.55cqh;background:currentColor}
.pc .rule svg{position:absolute;bottom:0;height:100%;fill:currentColor}
.pc .rule svg.l{left:0;width:6cqw}
.pc .rule svg.r{right:0;width:4cqw;height:220%}
.pc .nm{position:absolute;left:7.5cqw;right:7cqw;top:24cqh;bottom:5cqh;display:flex;flex-direction:column;justify-content:center;min-width:0}
.pc .nm b{font-weight:500;font-size:min(8cqh,7.4cqw);line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .nm.long b{font-size:min(6.4cqh,6cqw)}
.pc .nm.xl b{font-size:min(5.2cqh,5cqw);-webkit-line-clamp:3}
.pc .nm small{display:block;margin-top:1.4cqh;font:500 3.6cqh/1.3 var(--f-display);letter-spacing:.08em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .nm small.sku{font-size:3cqh;letter-spacing:.16em}
.pc .ph{position:absolute;right:5cqw;top:22cqh;bottom:5cqh;aspect-ratio:1;overflow:hidden;background:#222}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc.hasph .nm{right:calc(5cqw + 52cqh)}
.pc .pr{display:flex;align-items:baseline;gap:2.6cqw;white-space:nowrap;min-width:0}
.pc .pr span{font:500 9.4cqh/1 "Noto Serif TC",serif}
.pc .pr b{font:400 10cqh/1 var(--f-body);letter-spacing:.04em}
.pc .pr b.ask{font-size:6cqh}
.pc .vd{flex:none;height:72%;max-width:44%;background:#fff;color:#111;display:flex;align-items:center;gap:1.6cqw;padding:0 2cqw;overflow:hidden}
.pc .vd img{height:88%;max-width:100%;object-fit:contain;display:block}
.pc .vd .lg{width:auto;height:76%}
.pc .vd img.mk2{height:76%;width:auto}
.pc .vd .vt{min-width:0;line-height:1.15;font-family:var(--f-body)}
.pc .vd .vt b{display:block;font:700 5cqh/1.15 var(--f-body);white-space:nowrap}
.pc .vd .vt small{display:block;font:700 2.9cqh/1.2 var(--f-display);letter-spacing:.02em;white-space:nowrap}
.pc .vd.sep .vt{border-left:.3cqw solid #111;padding-left:1.4cqw}
/* theme: dark (original card) */
.pc.dark{background:#111;color:#fff}
.pc.dark .t{background:radial-gradient(circle at 30% 50%,rgba(255,255,255,.06),transparent 40%),#111}
.pc.dark .rule{color:#a3a7a9}
.pc.dark .b{background:var(--band,#2f3a40)}
/* theme: mono (catalog look) */
.pc.mono{background:#fff;color:#111;font-family:var(--f-body)}
.pc.mono .lbl{font-weight:700;background:#111;color:#fff;padding:0 1.6cqw;letter-spacing:.12em}
.pc.mono .rule{color:#111}
.pc.mono .rule svg{display:none}
.pc.mono .rule i{left:0;right:0;height:1.2cqh}
.pc.mono .nm b{font-weight:900}
.pc.mono .b{background:#111;color:#fff;border-top:2.2cqh solid transparent;border-image:var(--hatch) 1}
.pc.mono .pr span{font-family:var(--f-display);font-weight:700}
.pc.mono .pr b{font-family:var(--f-display);font-weight:700}
/* adaptive: portrait / near-square cards */
@container pc (aspect-ratio < .95){
 .pc .t{bottom:30%}
 .pc .b{height:30%;flex-direction:column;align-items:flex-start;justify-content:center;gap:2cqh;padding:0 6cqw}
 .pc .lbl{top:5cqh;left:7cqw;font-size:min(4.2cqh,7cqw)}
 .pc .rule{top:11cqh;height:2cqh}
 .pc .nm{top:15cqh;left:7cqw;right:7cqw;bottom:3cqh;justify-content:center}
 .pc.hasph .nm{justify-content:flex-start;padding-top:3cqh}
 .pc .nm b{font-size:min(7.2cqh,13cqw);-webkit-line-clamp:4}
 .pc .nm.long b{font-size:min(5.6cqh,10.5cqw)}
 .pc .nm.xl b{font-size:min(4.6cqh,8.6cqw);-webkit-line-clamp:5}
 .pc .nm small{font-size:min(3cqh,5cqw)}
 .pc .ph{position:relative;right:auto;top:auto;bottom:auto;width:100%;aspect-ratio:1;height:auto;margin-top:3cqh}
 .pc.hasph .nm{right:7cqw}
 .pc .pr span{font-size:min(6.4cqh,10cqw)}
 .pc .pr b{font-size:min(7.6cqh,12cqw)}
 .pc .vd{height:11cqh;width:100%;max-width:100%;padding:1cqh 3cqw;gap:2.4cqw}
 .pc .vd .vt b{font-size:min(4cqh,7.4cqw)}
 .pc .vd .vt small{font-size:min(2.4cqh,4.4cqw)}
}
/* very wide strips */
@container pc (aspect-ratio > 2.2){
 .pc .lbl{font-size:7cqh}
 .pc .nm b{font-size:min(11cqh,5cqw)}
 .pc .pr span,.pc .pr b{font-size:12cqh}
}
/* manual font sizes (細項設定) override the auto sizes */
.pc.fl .lbl{font-size:var(--fs-lbl)!important}
.pc.fn .nm b{font-size:var(--fs-nm)!important}
.pc.fn .nm small{font-size:calc(var(--fs-nm) * .45)!important}
.pc.fp .pr b{font-size:var(--fs-pr)!important}
.pc.fp .pr span{font-size:calc(var(--fs-pr) * .92)!important}
.fsz{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.fsz .f span{display:flex!important;justify-content:space-between}
.fsz .f em{font-style:normal;color:#b7b7b1}
.vlist .vi{border:2px solid #111;margin-bottom:10px}
.vlist .vh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.vlist .vh .pv{height:30px;min-width:60px;max-width:150px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:2px 4px;font-size:.7rem;color:var(--muted);overflow:hidden}
.vlist .vh .pv img{max-height:100%;max-width:100%}
.vlist .vh .pv .lg{width:auto;height:24px}
.vlist .vb{padding:10px 10px 2px}
.cpv{display:grid;place-items:center;background:var(--desk);padding:14px;margin-bottom:12px;overflow:hidden}
.fit{background:var(--bg2);border-left:3px solid #111;padding:6px 9px;font-size:.8rem;margin:0 0 10px}
.fit b{font:700 .95rem var(--f-display)}

/* empty */
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:8pt;border:.4mm dashed #cfcfca}


/* 商品照片編輯 */
.phs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin-bottom:10px}
.phs1{min-width:0;display:flex;flex-direction:column;gap:4px}
.pv4{position:relative;aspect-ratio:4/3;background:var(--bg2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:#b7b7b1}
.pv4 img{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.pv4 svg{width:40%;height:40%}
.pv4 .plus{font-size:1.4rem;color:#b7b7b1}
.pv4.crop{cursor:grab;touch-action:none}
.pv4.crop.drag{cursor:grabbing;outline:1px dashed #111}
.phb{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.phb b{font-size:.72rem;flex-basis:100%}
.phb .btn{padding:3px 7px;cursor:pointer}
.cropc{display:flex;align-items:center;gap:4px;font-size:.68rem;color:var(--muted);min-width:0}
.cropc span{white-space:nowrap}
.cropc input[type=range]{flex:1;min-width:0;width:auto;padding:0;height:18px;accent-color:#111}
.cropc output{min-width:2.8em;text-align:right;color:#111;font-weight:700}
@media(max-width:520px){.phs{grid-template-columns:1fr 1fr}}
/* 贈品編輯 */
.gift{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
.gth{width:56px;height:56px;border:1px dashed #9a9a96;display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:.68rem;color:var(--muted);background:var(--bg2)}
.gth img{width:100%;height:100%;object-fit:cover}
.gf{display:flex;flex-direction:column;gap:4px;min-width:0}
.gf input{width:100%;border:1px solid #cfcfca;background:#fff;padding:6px 8px;border-radius:0;font-size:.85rem}
.gf input:focus{border-color:#111;outline:none}
/* 庫存排序 */
.xsort{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xsort label{display:flex;align-items:center;gap:6px;min-width:0;font-size:.76rem;color:var(--muted)}
.xsort span{white-space:nowrap}
.xsort select{flex:1;min-width:0;border:1px solid #cfcfca;background:#fff;padding:7px 8px;border-radius:0;font-size:.85rem;color:#111}
/* DM 照片 */
.fc .img.mp{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:.4mm;place-items:stretch;background:#111}
.fc .img.mp>span{position:relative;overflow:hidden;background:var(--bg2);min-height:0}
.fc .img.mp.c2{grid-template-rows:1fr}.fc .img.mp.c4{grid-template-rows:repeat(3,1fr)}.fc .img.mp>span:first-child{grid-row:1/-1}
.pl.wt{align-items:center}
.pl.wt .ld{transform:none}
.pl .pth{width:var(--fth,7mm);height:var(--fth,7mm);flex:none;position:relative;overflow:hidden;background:var(--bg2);display:grid;place-items:center;color:#b7b7b1}
.pl .pth svg{width:60%;height:60%}
.pl .pth img,.pr2 .th img,.pk2 .ths .tb img{position:absolute;inset:0;width:100%;height:100%}
.pr2{grid-template-columns:var(--lth,12mm) minmax(0,1fr) auto}
.pr2 .th{width:var(--lth,12mm);height:var(--lth,12mm)}
.pk2 .ths .tb{position:relative;width:13mm;height:13mm;background:var(--bg2);overflow:hidden;display:grid;place-items:center;color:#b7b7b1;border:.2mm solid var(--line)}
.pk2 .ths .tb svg{width:60%;height:60%}
.gfs{display:flex;flex-wrap:wrap;gap:1.4mm 2.6mm;margin-top:1.2mm}
.gfs figure{margin:0;display:flex;align-items:center;gap:1.4mm;min-width:0}
.gfs span{position:relative;width:10mm;height:10mm;flex:none;border:.25mm solid #111;background:#fff;overflow:hidden}
.gfs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gfs figcaption{font:700 6.4pt/1.25 var(--f-body);max-width:32mm}
.gfs em{display:block;font:500 5.4pt var(--f-body);font-style:normal;color:var(--muted)}
.poster .gfs span{width:13mm;height:13mm}
.poster .gfs figcaption{font-size:8pt}
.pk2.gfc{grid-column:1/-1}
.pk2.gfc .bd{display:block}
.pk2.gfc .gfs{margin:0}
.pk2.gfc .gfs span{width:12mm;height:12mm}
/* DM 主打大卡 */
.fbs{flex:none;display:flex;flex-direction:column;gap:2.4mm}
.fb{display:flex;border:.5mm solid #111;min-width:0;background:#fff;overflow:hidden}
.fbp{width:var(--fbw,60mm);flex:none;display:flex;flex-direction:column;gap:.8mm;padding:.8mm;border-right:.35mm solid #111}
.fbm{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg2);display:grid;place-items:center;color:#b7b7b1}
.fbm svg{width:36%;height:36%}
.fbm img,.fbd span img{position:absolute;inset:0;width:100%;height:100%}
.fbd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8mm}
.fbd span{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg2)}
.fbt{position:absolute;left:0;top:0;display:flex;z-index:1}
.fbt b{background:#111;color:#fff;font:900 6pt/1 var(--f-body);padding:1mm 2mm;letter-spacing:.12em;white-space:nowrap}
.fbt i{width:6mm;background:var(--hatch);border:.3mm solid #111}
.fbx{flex:1;min-width:0;padding:2.4mm 3mm;display:flex;flex-direction:column;gap:1mm}
.fbx .mt{font:700 5.4pt var(--f-display);letter-spacing:.08em;color:var(--muted)}
.fbx h3{margin:0;font:900 12pt/1.25 var(--f-body)}
.fbx .en{font:500 5.6pt var(--f-display);letter-spacing:.08em;color:var(--muted)}
.fbx .hl{font-size:7pt;font-weight:700;line-height:1.5}
.fbx .ds{font-size:6.6pt;line-height:1.6;color:#2b2b28;overflow:hidden;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;white-space:pre-line}
.fbx .gap{flex:1}
.fbx .tg2{align-self:flex-start;background:#111;color:#fff;font:700 5.8pt/1.6 var(--f-body);padding:0 1.6mm}
.fbx .mat{display:flex;gap:3mm;font-size:6.4pt;font-weight:500;border-bottom:.2mm solid var(--line);padding-bottom:.8mm}
.fbx .mat span{color:var(--muted)}
.fbx .pr{display:flex;align-items:baseline;gap:1.6mm;flex-wrap:wrap}
.fbx .pr .now{font:900 15pt/1 var(--f-display)}
.fbx .pr .now small{font-size:9pt;margin-right:.6mm}
.fbx .pr s{font:500 6pt var(--f-display);color:var(--muted)}
.fb.so h3,.fb.so .pr .now{text-decoration:line-through;color:#9a9a96}
.fbs.n2 .fbx h3{font-size:10pt}.fbs.n2 .fbx .ds{-webkit-line-clamp:4}.fbs.n2 .fbx .pr .now{font-size:12pt}
.fbs.n3 .fbx{padding:1.6mm 2.4mm;gap:.6mm}.fbs.n3 .fbx h3{font-size:8.6pt}.fbs.n3 .fbx .hl{font-size:6.4pt}.fbs.n3 .fbx .ds{-webkit-line-clamp:2;font-size:6pt}.fbs.n3 .fbx .pr .now{font-size:11pt}.fbs.n3 .fbt b{font-size:5pt;padding:.7mm 1.4mm}
/* DM 活動型 */
.promo .dbd{gap:3.2mm}
.phimg{flex:none;border:.5mm solid #111;overflow:hidden;height:56mm}
.phimg img{display:block;width:100%;height:100%;object-fit:cover}
.pks{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:2.4mm}
.pk2{display:flex;border:.5mm solid #111;min-width:0;background:#fff}
.pk2>i{writing-mode:vertical-rl;font-style:normal;background:#111;color:#fff;font:700 6pt var(--f-body);letter-spacing:.3em;padding:1.6mm .9mm;display:flex;align-items:center;justify-content:center;flex:none}
.pk2 .bd{flex:1;padding:1.8mm 2.6mm;min-width:0;display:flex;flex-direction:column;justify-content:center;background:repeating-linear-gradient(135deg,#fff 0 1.6mm,#f2f2ef 1.6mm 3.2mm)}
.pk2 b{font:900 12pt/1.15 var(--f-body)}
.pk2 small{font-size:6.2pt;color:var(--muted);margin-top:.6mm}
.pk2.wide{grid-column:1/-1}
.pk2.wide .bd{flex-direction:row;align-items:center;gap:3mm}
.pk2.wide b{font-size:9pt;display:block}
.pk2 .ths{display:flex;align-items:center;gap:1mm;flex:none}
.pk2 .ths span{width:13mm;height:13mm;background:var(--bg2);overflow:hidden;display:grid;place-items:center;color:#b7b7b1;border:.2mm solid var(--line)}
.pk2 .ths img{width:100%;height:100%;object-fit:cover}
.pk2 .ths svg{width:60%;height:60%}
.pk2 .ths em{font-style:normal;font-weight:900;font-size:8pt}
.pk2 .pr{display:flex;gap:1.6mm;align-items:baseline;margin-top:.6mm}
#cmpStage{padding:4px 0 30px}
#cmpStage canvas{display:block;margin:0 auto;width:min(100%,620px);height:auto;box-shadow:0 0 0 1px #c9c9c4,0 10px 30px rgba(0,0,0,.12);cursor:move;touch-action:none;background:#fff}
/* ===================================================================
   擺攤工具箱 shell: left rail on desktop, bottom tab bar on phone
   =================================================================== */
.shell{display:grid;grid-template-columns:78px minmax(0,1fr);height:100vh;height:100dvh}
.nav{background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 0;z-index:30}
.nav .nlogo{padding:2px 0 12px}
.nav .nlogo .lg{width:34px}
.nav button{width:66px;border:0;background:none;color:#8f8f8a;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font:700 .68rem var(--f-display);letter-spacing:.08em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav button svg{width:24px;height:24px}
.nav button.on{color:#fff}
.nav button.on svg{background:#fff;color:#111;padding:2px;width:28px;height:28px;margin:-2px}
.netp{margin-top:auto;font:700 .58rem/1.35 var(--f-display);letter-spacing:.04em;text-align:center;color:#8f8f8a;padding:0 4px}
.netp.on{color:#fff}
.si{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.main{min-width:0;min-height:0;position:relative;overflow:hidden}
.mod{position:absolute;inset:0;overflow:auto;background:var(--desk);-webkit-overflow-scrolling:touch}
#m-dm{overflow:hidden}
.xw{max-width:780px;margin:0 auto;min-height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 0 1px #d6d6d1}
.xh{flex:none;position:sticky;top:0;z-index:6;background:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:3px solid #111}
.xh .lg{width:28px}
.xh b{font:700 1.05rem var(--f-display);letter-spacing:.03em;line-height:1.2}
.xh small{display:block;font:500 .62rem var(--f-display);letter-spacing:.2em;color:var(--muted)}
.upd{display:block;font:500 .62rem/1.4 var(--f-body)!important;letter-spacing:.02em!important;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.upd{cursor:pointer}.upd:hover{color:#111}color:#111!important;font-weight:700!important}
.xh .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.xb{flex:1;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px;min-height:0}
.xhd{font:700 .74rem var(--f-display);letter-spacing:.2em;text-transform:uppercase;border-bottom:3px solid #111;padding-bottom:2px;display:flex;align-items:baseline;gap:8px}
.xhd em{margin-left:auto;font-style:normal;font-weight:500;letter-spacing:.06em;color:var(--muted);text-transform:none}
.xpill{font:700 .68rem/1 var(--f-display);letter-spacing:.06em;border:1.5px solid #111;padding:6px 8px;white-space:nowrap;background:#fff;color:#111;cursor:pointer}
.xpill.k{background:#111;color:#fff}
.xstats{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid #111}
.xstats div{padding:7px 10px;border-left:1px solid var(--line);min-width:0}
.xstats div:first-child{border-left:0}
.xstats b{display:block;font:700 1.3rem/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xstats small{font-size:.64rem;color:var(--muted);letter-spacing:.1em}
.xstats .k{background:#111;color:#fff}.xstats .k small{color:#bbb}
.xsearch{width:100%;border:1px solid #cfcfca;padding:9px 10px;border-radius:0;background:#fff}
.xsearch:focus{border-color:#111;outline:none}
.xchips{display:flex;gap:6px;overflow-x:auto;flex:none;scrollbar-width:none;padding-bottom:1px}
.xchips::-webkit-scrollbar{display:none}
.xchips button{flex:none;border:1px solid #cfcfca;background:#fff;padding:5px 11px;font-size:.8rem;white-space:nowrap;cursor:pointer}
.xchips button.on{background:#111;color:#fff;border-color:#111}
.xth{width:44px;height:44px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;color:#b7b7b1;overflow:hidden;flex:none}
.xth img{width:100%;height:100%;object-fit:cover}
.xth svg{width:24px;height:24px}
.xil{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.xil li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.xil li:hover{background:var(--bg2)}
.xil b{display:block;font-weight:500;font-size:.9rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xil .m{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xq{text-align:right;line-height:1.1;min-width:44px}
.xq b{font:700 1.3rem var(--f-display)}
.xq small{display:block;font-size:.6rem;color:var(--muted);letter-spacing:.06em}
.xq.low b{background:#111;color:#fff;padding:0 6px}
.xq.zero b{text-decoration:line-through;color:#9a9a96}
.xq.na b{color:#b7b7b1;font-size:1rem}
.xtag{display:inline-block;font:700 .58rem/1.5 var(--f-display);border:1.5px solid #111;padding:0 4px;margin-left:4px;vertical-align:1px}
.xfab{position:sticky;bottom:16px;align-self:flex-end;margin:-8px 0 0;width:56px;height:56px;background:#111;color:#fff;border:0;display:grid;place-items:center;font:400 2rem/1 var(--f-display);box-shadow:0 0 0 3px #fff,0 0 0 5px #111;cursor:pointer;z-index:4}
.xbtn{display:flex;align-items:center;justify-content:center;gap:6px;background:#111;color:#fff;border:2px solid #111;padding:13px;font:700 .88rem var(--f-display);letter-spacing:.14em;cursor:pointer;width:100%}
.xbtn.ghost{background:#fff;color:#111}
.xbtn:disabled{opacity:.35;cursor:default}
.xseg{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid #111;flex:none}
.xseg button{border:0;border-left:1px solid #cfcfca;background:#fff;padding:8px 0;font:700 .78rem var(--f-body);cursor:pointer}
.xseg button:first-child{border-left:0}
.xseg button.on{background:#111;color:#fff}
.xfl{display:block}
.xfl>span{display:block;font-size:.74rem;color:var(--muted);margin-bottom:3px}
.xfl input,.xfl select,.xfl textarea{width:100%;border:1px solid #cfcfca;padding:9px 10px;background:#fff;border-radius:0}
.xfl input:focus,.xfl select:focus{border:2px solid #111;padding:8px 9px;outline:none}
.xtwo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xpick{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;border:2px solid #111;padding:8px}
.xpick .xth{width:52px;height:52px}
.xpick b{display:block;font-size:.95rem}
.xpick small{color:var(--muted);font-size:.74rem}
.xstep{display:flex;align-items:stretch;border:2px solid #111;height:54px}
.xstep button{width:60px;border:0;background:var(--bg2);font:500 1.7rem var(--f-display);cursor:pointer}
.xstep input{flex:1;min-width:0;border:0;border-left:2px solid #111;border-right:2px solid #111;text-align:center;font:700 1.7rem var(--f-display)}
.xnote{border-left:3px solid #111;background:var(--bg2);padding:7px 10px;font-size:.8rem}
.xlog{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.xlog li{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.82rem}
.xlog i{font-style:normal;font:700 .62rem/1 var(--f-display);letter-spacing:.04em;border:1.5px solid #111;padding:4px 0;text-align:center}
.xlog i.k{background:#111;color:#fff}
.xlog small{display:block;color:var(--muted);font-size:.68rem}
.xlog b{font:700 .95rem var(--f-display);text-align:right}
.xlog li.void>div,.xlog li.void b{text-decoration:line-through;color:#9a9a96}
.xlog .x{border:1px solid #cfcfca;background:#fff;font-size:.7rem;padding:3px 7px;cursor:pointer}
.xempty{border:1px dashed #cfcfca;padding:18px;text-align:center;color:var(--muted);font-size:.85rem}

/* POS */
#m-pos .xw{height:100%;min-height:0}
.posh{flex:none;display:flex;align-items:center;gap:9px;padding:10px 14px 8px;border-bottom:3px solid #111;background:#fff}
.posh .lg{width:26px}
.posh .ev{min-width:0;line-height:1.25;flex:1}
.posh .ev b{display:block;font:900 .95rem var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.posh .ev small{font:500 .64rem var(--f-display);letter-spacing:.12em;color:var(--muted)}
.posh .tot{text-align:right;line-height:1.1;background:#111;color:#fff;padding:5px 9px;flex:none}
.posh .tot small{display:block;font:700 .56rem var(--f-display);letter-spacing:.18em;color:#bbb}
.posh .tot b{font:700 1.05rem var(--f-display)}
.posb{flex:1;min-height:0;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
.tile{position:relative;border:1.5px solid #111;display:flex;flex-direction:column;background:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;text-align:left;padding:0;font:inherit;color:inherit}
.tile .im{position:relative;aspect-ratio:1/.78;background:var(--bg2);display:grid;place-items:center;color:#b7b7b1;border-bottom:1px solid var(--line);overflow:hidden}
.tile .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .im svg{width:34%;height:34%}
.tile .tx{padding:4px 6px 5px;line-height:1.25;min-width:0}
.tile .tx b{display:block;font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tx span{font:700 .86rem var(--f-display)}
.tile .tx s{font:500 .66rem var(--f-display);color:var(--muted);margin-left:3px}
.tile .st{position:absolute;right:3px;top:3px;font:700 .6rem/1.5 var(--f-display);background:#fff;border:1.2px solid #111;padding:0 4px}
.tile .st.low{background:#111;color:#fff}
.tile .n{position:absolute;left:-1.5px;top:-1.5px;background:#111;color:#fff;font:700 .9rem/1 var(--f-display);padding:5px 7px;z-index:1}
.tile.sel{box-shadow:inset 0 0 0 2px #111}
.tile.out{opacity:.4;cursor:not-allowed}
.tile.out .im::after{content:"完售";position:absolute;inset:0;display:grid;place-items:center;font:900 1rem var(--f-body);letter-spacing:.2em;color:#111;background:rgba(255,255,255,.6)}
.tile.cus{border-style:dashed;justify-content:center;align-items:center;gap:2px;min-height:110px}
.tile.cus i{font:400 1.8rem/1 var(--f-display);font-style:normal}
.cart{flex:none;border-top:3px solid #111;background:#fff;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.cart .row{display:flex;align-items:center;gap:8px;margin-top:4px}
.cart .cnt{font:700 .74rem var(--f-display);letter-spacing:.1em}
.cart .sum2{margin-left:auto;font:700 1.6rem/1 var(--f-display)}
.cart .sum2 small{font-size:.8rem;font-weight:500;margin-right:2px}
.cart .xbtn{width:auto;flex:none;padding:12px 20px}
.cart>.xbtn{width:100%}
.lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto 76px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.lines .q{display:flex;border:1.5px solid #111}
.lines .q button{width:32px;border:0;background:#fff;font:500 1.1rem/28px var(--f-display);cursor:pointer}
.lines .q b{width:30px;text-align:center;font:700 .95rem/28px var(--f-display);border-left:1.5px solid #111;border-right:1.5px solid #111}
.lines li>b{text-align:right;font:700 .95rem var(--f-display)}
.lines small{display:block;color:var(--muted);font-size:.7rem}
.disc{display:flex;justify-content:space-between;align-items:center;border:1px dashed #111;padding:7px 10px;font-size:.82rem}
.disc b{font:700 .95rem var(--f-display)}
.due{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:4px}
.due small{font:700 .66rem var(--f-display);letter-spacing:.2em;color:var(--muted)}
.due b{font:700 2.3rem/1 var(--f-display)}
.payg{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:5px}
.payg button{border:1.5px solid #111;background:#fff;padding:9px 0;font:700 .76rem var(--f-body);cursor:pointer}
.payg button.on{background:#111;color:#fff}
.cash{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cash button{border:1px solid #cfcfca;background:#fff;padding:8px 0;font:700 .86rem var(--f-display);cursor:pointer}
.chg{display:grid;grid-template-columns:1fr 1fr;border:2px solid #111}
.chg div{padding:6px 10px;min-width:0}
.chg div+div{background:#111;color:#fff}
.chg small{display:block;font:700 .6rem var(--f-display);letter-spacing:.18em;opacity:.7}
.chg b{font:700 1.55rem/1.1 var(--f-display)}
.chg.bad div+div{background:#fff;color:#111;border-left:2px dashed #111}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.keys button{border:1px solid #cfcfca;background:#fff;padding:11px 0;font:500 1.35rem var(--f-display);cursor:pointer;touch-action:manipulation}
.keys button.k{background:var(--bg2)}
.done{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;border:2px solid #111;padding:20px}
.done .ck{width:58px;height:58px;background:#111;color:#fff;display:grid;place-items:center}
.done .ck svg{width:34px;height:34px}
.done h3{margin:4px 0 0;font:900 1.15rem var(--f-body)}
.done p{margin:0;font-size:.8rem;color:var(--muted)}
.done .big2{font:700 2.1rem/1 var(--f-display)}
.strip{height:10px;background:repeating-linear-gradient(135deg,#111 0 6px,#fff 6px 12px);flex:none}
.xrow{display:flex;gap:8px}

/* report */
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;border-bottom:2px solid #111;padding:0 2px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.bars i{display:block;width:100%;background:#111;min-height:1px}
.bars i.h{background:repeating-linear-gradient(135deg,#111 0 4px,#fff 4px 8px);border:1.5px solid #111}
.bars small{font:500 .56rem var(--f-display);color:var(--muted);white-space:nowrap}
.axis{display:flex;gap:5px;padding:0 2px}
.axis span{flex:1;text-align:center;font:500 .6rem var(--f-display);color:var(--muted);min-width:0}
.rk{list-style:none;margin:0;padding:0;counter-reset:r}
.rk li{display:grid;grid-template-columns:22px minmax(0,1fr) 30% auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.82rem;counter-increment:r}
.rk li::before{content:counter(r);font:700 .7rem var(--f-display);background:#111;color:#fff;width:20px;height:20px;display:grid;place-items:center}
.rk li>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .b{height:8px;background:var(--bg2);position:relative}
.rk .b i{position:absolute;left:0;top:0;bottom:0;background:#111}
.rk b{font:700 .86rem var(--f-display);text-align:right;min-width:56px}
.pays2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pays2 div{border:1px solid #cfcfca;padding:7px 9px;display:flex;justify-content:space-between;font-size:.8rem;gap:6px}
.pays2 b{font:700 .88rem var(--f-display)}

/* quick table */
.qt{width:100%;border-collapse:collapse;font-size:.8rem}
.qt th{font:700 .66rem var(--f-display);letter-spacing:.08em;text-align:left;color:var(--muted);border-bottom:2px solid #111;padding:4px 3px;white-space:nowrap}
.qt td{border-bottom:1px solid var(--line);padding:3px}
.qt input[type=text],.qt input[type=number]{width:100%;min-width:52px;border:1px solid transparent;padding:5px 4px;background:transparent}
.qt input:focus{border-color:#111;background:#fff;outline:none}
.qt td.nm input{min-width:120px}
.qtw{overflow-x:auto;border:1px solid var(--line)}

/* discount rules editor */
.pcard{border:2px solid #111;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:#fff}
.pcard.off{border-style:dashed;opacity:.6}
.pcard .chk b{font-size:.92rem}
.xrule{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;font-size:.85rem}
.xrule input[type=number]{width:90px;border:1px solid #cfcfca;padding:6px 8px}
#rules{margin-bottom:12px}
.edsec{font:700 .7rem var(--f-display);letter-spacing:.18em;border-bottom:2px solid #111;padding-bottom:2px;margin:14px 0 8px}

/* modal sheet */
.xm{position:fixed;inset:0;z-index:50;background:rgba(17,17,17,.45);display:flex;align-items:flex-end;justify-content:center}
.xm[hidden]{display:none}
.xm .box{background:#fff;width:100%;max-width:620px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-top:3px solid #111}
.xm .mh{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.xm .mh b{font:700 .95rem var(--f-display)}
.xm .mh button{margin-left:auto}
.xm .mb{flex:1;min-height:0;overflow:auto;padding:0 14px 14px}
.xm .ed{border:0;padding:6px 0 0;margin:0}

@media(min-width:761px){.xm{align-items:center}.xm .box{border:3px solid #111}}
@media(max-width:960px){#m-dm{overflow:auto}}
@media(max-width:760px){
 .shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
 .nav{grid-row:2;flex-direction:row;justify-content:space-around;align-items:stretch;padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));gap:0;border-top:3px solid #111}
 .nav .nlogo,.netp{display:none}
 .nav button{width:auto;flex:1;padding:6px 0}
 .xh,.posh{padding-top:calc(10px + env(safe-area-inset-top,0px))}
 .cart{padding-bottom:10px}
 input,select,textarea{font-size:16px!important}
 .xw{box-shadow:none}
}

@media print{
  html,body{height:auto;background:#fff}
  .ui,.vbar,.nav,.xm,#toast{display:none!important}
  .shell,.main{display:block;height:auto;overflow:visible}
  .mod:not(#m-dm){display:none!important}
  #m-dm{position:static;overflow:visible}
  .app{display:block;height:auto}
  .view,#preview{display:block;overflow:visible;padding:0}
  #sheets{transform:none!important;zoom:1!important;width:auto}
  .sheet,.csheet{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .sheet.lastp,.csheet.lastp{break-after:auto;page-break-after:auto}
  .csheet .lab{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="shell">
<nav class="nav" id="nav" aria-label="功能"></nav>
<main class="main">
<section class="mod" id="m-pos" hidden></section>
<section class="mod" id="m-inv" hidden></section>
<section class="mod" id="m-in" hidden></section>
<section class="mod" id="m-rep" hidden></section>
<section class="mod" id="m-ev" hidden></section>
<section class="mod" id="m-dm" hidden>
<div class="app">
  <aside class="ui">
    <div class="ui-h"><span class="lg"></span><div><b>擺攤 DM 生成器</b><small>STALL FLYER MAKER</small><small class="upd" data-upd></small></div></div>
    <div class="tabs" role="tablist">
      <button data-tab="prod" class="on">商品</button>
      <button data-tab="event">攤位活動</button>
      <button data-tab="lay">版面</button>
      <button data-tab="card">小卡</button><button data-tab="img">修圖</button>
      <button data-tab="data">資料／列印</button>
    </div>
    <div class="pane" id="pane"></div>
    <div class="status" id="status">載入中…</div>
  </aside>
  <section class="view">
    <div class="vbar">
      <div class="cnt" id="cnt"></div>
      <div class="sp"></div>
      <label>預覽 <select id="view"><option value="both">DM＋小卡</option><option value="dm">只看 DM</option><option value="cards">只看小卡</option></select></label>
      <label>紙張 <select id="paper"><option value="a5">A5 單張</option><option value="a4">A4 放大</option><option value="imp">A6×4 拼 A4</option></select></label>
      <label>縮放 <select id="zoom"><option value=".6">60%</option><option value=".8">80%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select></label>
      <button class="btn" id="printBtn">列印／存成 PDF</button>
    </div>
    <div id="preview"><div id="sheets"></div></div>
  </section>
</div>
</section>

function bindEditor(p,o){if(!p)return;o=o||{};const re=o.re||tabProd,done=o.done||(()=>{cur=null;tabProd()});
 const bind=(id,k)=>{$(id).oninput=e=>{p[k]=e.target.value;changed()}};
 bind("#eName","name");bind("#eEn","en");bind("#eSku","sku");bind("#ePrice","price");bind("#eDm","dmPrice");bind("#eCost","cost");bind("#eNote","dmNote");bind("#eBadge","badge");bind("#eHl","headline");bind("#eDesc","desc");bind("#eMat","material");bind("#eDate","date");bind("#eJPY","priceJPY");bind("#eUSD","priceUSD");bind("#eKRW","priceKRW");bind("#eSub","sub");bind("#eCl","cardLabel");
 $("#eQty").oninput=e=>{p.cardQty=Math.max(0,parseInt(e.target.value)||0);changed()};
 $("#eStock").onchange=e=>{const v=e.target.value.trim();if(v===""){p.stock=null;changed();return}const n=Math.round(+v);if(!isFinite(n))return;if(p.stock==null)p.stock=0;stockMove(p,"count",n,{note:"直接修改"});changed();re()};
 $("#eSafe").oninput=e=>{const v=e.target.value.trim();p.safe=v===""?null:Math.max(0,+v||0);changed()};
 $("#eOn").onchange=e=>{p.on=e.target.checked;changed(true)};
 $("#eFeat").onchange=e=>{if(e.target.checked&&!p.feat&&featured().length>=(S.settings.layout==="poster"?4:3)){alert("主打最多 "+(S.settings.layout==="poster"?4:3)+" 件，請先取消其他主打。");e.target.checked=false;return}p.feat=e.target.checked;if(p.feat){p.on=true;$("#eOn").checked=true}changed(true)};
 $("#eVen").onchange=e=>{if(e.target.value)p.vendor=e.target.value;else delete p.vendor;changed(true);re()};
 $("#eCat").onchange=e=>{p.cat=e.target.value;changed(true)};
 $("#eSold").onchange=e=>{p.soldout=e.target.checked;changed(true)};
 bindPhotos(p,re);

 $("#eDone").onclick=done;
 $("#eDel").onclick=()=>{if(!confirm("刪除「"+p.name+"」？進出貨與銷售紀錄會保留。"))return;S.products=S.products.filter(x=>x!==p);if(cur===p.id)cur=null;changed(true);done()};
}

function importCatalog(d){
 if(!d||!Array.isArray(d.products)){alert("這不是商品型錄的備份檔（找不到 products）。");return}
 const cs=d.settings||{};let add=0,upd=0;
 if(cs.brand)S.settings.brand=cs.brand;if(cs.brandEn)S.settings.brandEn=cs.brandEn;if(cs.logo)S.settings.logo=cs.logo;if(cs.footer)S.settings.footer=cs.footer;
 if(cs.curSym)Object.assign(S.settings.curSym,cs.curSym);else if(cs.currency)S.settings.curSym.TWD=cs.currency;
 if(Array.isArray(d.cats)&&d.cats.length)S.cats=d.cats.map(c=>({id:c.id,name:c.name,short:(S.cats.find(x=>x.id===c.id)||{}).short||"",glyph:c.glyph||(c.name||"?").slice(0,1),icon:c.icon||"b"}));
 d.products.forEach((p,i)=>{const ex=S.products.find(x=>(p.sku&&x.sku===p.sku)||x.id===p.id||x.name===p.name);
  const data={cat:p.cat,name:p.name,en:p.en||"",sku:p.sku||"",price:p.price||"",priceJPY:p.priceJPY||"",priceUSD:p.priceUSD||"",priceKRW:p.priceKRW||"",img:p.img||undefined,headline:p.headline||(p.desc||"").slice(0,60),badge:p.badge||"",order:p.order||i};
  if(ex){Object.assign(ex,data);upd++}else{S.products.push(Object.assign({id:p.id||uid(),on:!p.hidden,feat:false},data));add++}});
 changed(true);tab="prod";document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="prod"));renderTab();
 alert("已匯入：新增 "+add+" 件、更新 "+upd+" 件。到「商品」勾選要印的商品並設定主打。")}


/* ---------- vendors & product cards ---------- */
const kws=v=>String(v.match||"").split(/[,，、\n]/).map(x=>x.trim().toLowerCase()).filter(Boolean);
function autoVendor(p){const hay=[p.name,p.en,p.sku,p.sub,catById(p.cat).name].join(" ").toLowerCase();
 for(const v of S.vendors){if(kws(v).some(k=>hay.includes(k)))return v}
 return S.vendors.find(v=>v.id===S.settings.defVendor)||S.vendors[0]||{id:"",name:"（無廠商）"}}
function vendorOf(p){return(p.vendor&&S.vendors.find(v=>v.id===p.vendor))||autoVendor(p)}
function vendorMark(v){if(v.logo)return'<img src="'+esc(v.logo)+'" alt="'+esc(v.name)+'">';

function cardItems(){const c=S.settings.card;
 const base=c.scope==="all"?S.products.slice().sort((a,b)=>catOrder(a.cat)-catOrder(b.cat)||((a.order||0)-(b.order||0))):c.scope==="pick"?S.products.filter(p=>p.card):chosen();

function cardFit(){const c=S.settings.card,[a,b]=PAPERS[c.paper]||PAPERS.A4,m=+c.margin||0,g=+c.gap||0,w=+c.w,h=+c.h;
 const fit=(pw,ph)=>{const cols=Math.max(0,Math.floor((pw-2*m+g)/(w+g))),rows=Math.max(0,Math.floor((ph-2*m+g)/(h+g)));return{pw,ph,cols,rows,n:cols*rows}};
 const P=fit(a,b),L=fit(b,a);return c.orient==="p"?P:c.orient==="l"?L:(L.n>P.n?L:P)}
function buildCards(host){const c=S.settings.card,f=cardFit(),items=cardItems(),w=+c.w,h=+c.h,g=+c.gap||0,sheets=[];
 if(!f.n||!items.length)return{sheets,f,count:items.length};
 const gw=f.cols*w+(f.cols-1)*g,gh=f.rows*h+(f.rows-1)*g,ox=(f.pw-gw)/2,oy=(f.ph-gh)/2;
 const xs=[],ys=[];for(let i=0;i<f.cols;i++){xs.push(i*(w+g));xs.push(i*(w+g)+w)}for(let i=0;i<f.rows;i++){ys.push(i*(h+g));ys.push(i*(h+g)+h)}
 const ux=[...new Set(xs.map(x=>x.toFixed(2)))].map(Number),uy=[...new Set(ys.map(y=>y.toFixed(2)))].map(Number);
 const L=Math.min(4,Math.max(1.5,Math.min(ox,oy)-1)),gap=.8,t=.15;
 const marks=c.marks?ux.map(x=>'<i class="mk" style="left:'+(ox+x-t/2)+'mm;top:'+(oy-gap-L)+'mm;width:'+t+'mm;height:'+L+'mm"></i><i class="mk" style="left:'+(ox+x-t/2)+'mm;top:'+(oy+gh+gap)+'mm;width:'+t+'mm;height:'+L+'mm"></i>').join("")+
  uy.map(y=>'<i class="mk" style="top:'+(oy+y-t/2)+'mm;left:'+(ox-gap-L)+'mm;height:'+t+'mm;width:'+L+'mm"></i><i class="mk" style="top:'+(oy+y-t/2)+'mm;left:'+(ox+gw+gap)+'mm;height:'+t+'mm;width:'+L+'mm"></i>').join(""):"";
 const pages=Math.ceil(items.length/f.n);
 for(let pi=0;pi<pages;pi++){const sh=document.createElement("div");sh.className="csheet";sh.style.width=f.pw+"mm";sh.style.height=f.ph+"mm";
  sh.innerHTML='<div class="cg" style="left:'+ox+'mm;top:'+oy+'mm;grid-template-columns:repeat('+f.cols+','+w+'mm);grid-auto-rows:'+h+'mm;gap:'+g+'mm">'+items.slice(pi*f.n,(pi+1)*f.n).map(cardHTML).join("")+'</div>'+marks+
   '<span class="lab" style="left:'+ox+'mm;top:'+Math.max(.5,oy-gap-L-3)+'mm">商品小卡 '+(w/10)+'×'+(h/10)+' cm · '+(pi+1)+' / '+pages+'</span>';
  host.appendChild(sh);sheets.push(sh)}
 return{sheets,f,count:items.length}}

function autoPt(k){const c=S.settings.card,w=+c.w,h=+c.h,qw=w/100,qh=h/100,port=w/h<.95,wide=w/h>2.2,pt=mm=>(mm*2.8346).toFixed(1);
 if(k==="lbl")return pt(port?Math.min(4.2*qh,7*qw):wide?7*qh:5.6*qh);
 if(k==="nm")return pt(port?Math.min(7.2*qh,13*qw):wide?Math.min(11*qh,5*qw):Math.min(8*qh,7.4*qw));

/* flow rows into columns, adding continuation pages when they run out */
function flowPages(host,items,opt){
 const pages=[];
 const newPage=first=>{const pg=document.createElement("div");pg.className="page";if(opt.vars)Object.keys(opt.vars).forEach(k=>pg.style.setProperty(k,opt.vars[k]));
  pg.innerHTML=first?opt.first():head(opt.fresh?"PRICE LIST":"PRICE LIST · 續")+'<div class="dbd"><div class="st"><b>價目表</b><small>Price list</small><em>'+(opt.fresh?items.length+" ITEMS":"續")+'</em></div><div class="flow'+(opt.cols===1?" one":"")+'"><div class="col"></div>'+(opt.cols===1?"":'<div class="col"></div>')+'</div></div>'+foot(0,0);
  host.appendChild(pg);pages.push(pg);return pg};
 let pg=newPage(true),cols=[...pg.querySelectorAll(".col")],ci=0,lastCat=null;
 if(!cols.length)return pages;
 const fits=col=>col.scrollHeight<=col.clientHeight+.5;
 for(const p of items){
  const html=(S.settings.groupCat&&p.cat!==lastCat?catHead(catById(p.cat)):"")+opt.row(p);
  let placed=false;
  while(!placed){const col=cols[ci],mark=col.children.length;col.insertAdjacentHTML("beforeend",html);
   if(fits(col)||(mark===0&&(pg!==pages[0]||col.clientHeight>=40))){placed=true;lastCat=p.cat}
   else{while(col.children.length>mark)col.lastChild.remove();ci++;
    if(ci>=cols.length){
     /* nothing fitted on the first page: drop its empty price-list heading and start the list fresh on the next page */
     if(pg===pages[0]&&!pg.querySelector(".col *")){pg.querySelectorAll(".dbd>.st,.dbd>.flow").forEach(x=>x.remove());const sp=document.createElement("div");sp.style.flex="1";const o=pg.querySelector(".offer,.info");pg.querySelector(".dbd").insertBefore(sp,o);opt.fresh=true}
     pg=newPage(false);opt.fresh=false;cols=[...pg.querySelectorAll(".col")];ci=0;lastCat=null}}}}
 return pages}

function stockMove(p,type,qty,o){o=o||{};const before=p.stock==null?null:+p.stock,cb=p.cost||"";
 if(before==null&&(type==="sale"||type==="void"))return null;
 const after=type==="count"?Math.round(qty):(before||0)+Math.round(qty);
 if(type==="in"&&o.cost!==""&&o.cost!=null&&isFinite(+o.cost)&&qty>0){const old=num(p.cost),b=Math.max(0,before||0);
  p.cost=String(Math.round((old!=null&&b>0?(old*b+(+o.cost)*qty)/(b+qty):+o.cost)*100)/100)}
 p.stock=after;if(S.settings.autoSold!==false)p.soldout=after<=0;
 const m={id:uid("m"),t:o.t||Date.now(),type,pid:p.id,name:p.name,qty:after-(before||0),before,after,cost:o.cost==null?"":String(o.cost),note:o.note||"",sale:o.sale||"",cb};
 S.moves.unshift(m);if(S.moves.length>8000)S.moves.length=8000;return m}

const evExp=e=>e?(+e.fee||0)+(e.costs||[]).reduce((a,c)=>a+(+c.a||0),0):0;

 return{rev,cost,disc,gp,exp,net,tgt,margin:rev?gp/rev:0,be:rev&&gp>0?exp/(gp/rev):null,pct:tgt?rev/tgt:null}}

/* ---------- 優惠計算 ----------
   amt  滿額折：滿 min 折 off（rep＝每滿都折）
   pct  打折：範圍內商品打 rate 折（9＝九折、85＝八五折），可設門檻 min
   nfor 任選 N 件 price 元
   bxgy 買 n 送 m（同範圍內，送最便宜的）
   bundle 組合價：items 各一件合購 price 元
   擇優（best）：只套用最划算的一個；疊加（stack）：依 組合→買送→任選→打折→滿額 順序全部套用，同一件商品不重複折扣 */
const PROMO_T=[["amt","滿額折"],["pct","打折"],["nfor","任選 N 件"],["bxgy","買 N 送 M"],["bundle","組合價"]];
const PROMO_RANK={bundle:0,bxgy:1,nfor:2,pct:3,amt:4};
const rnd=x=>S.settings.cur==="USD"?Math.round(x*100)/100:Math.round(x);
function rateOf(v){v=+v;return!(v>0)?1:v<10?v/10:v<100?v/100:1}
const rateTxt=v=>{const r=rateOf(v);return String(Math.round(r*100)%10===0?Math.round(r*10):Math.round(r*100))};
const scopeTxt=p=>p.scope?(catById(p.scope).short||catById(p.scope).name)+" ":"全館 ";
function promoName(p){if(p.name&&p.name.trim())return p.name.trim();
 switch(p.type){case"amt":return(p.rep?"每滿 ":"滿 ")+fmtM(p.min)+" 折 "+fmtM(p.off);
  case"pct":return scopeTxt(p)+rateTxt(p.rate)+" 折"+(p.min>0?"（滿 "+fmtM(p.min)+"）":"");
  case"nfor":return scopeTxt(p).replace("全館 ","")+"任選 "+p.n+" 件 "+fmtM(p.price);
  case"bxgy":return scopeTxt(p).replace("全館 ","")+"買 "+p.n+" 送 "+p.m;
  case"bundle":return"組合價："+(p.items||[]).map(id=>(S.products.find(x=>x.id===id)||{name:"?"}).name).join("＋")+" "+fmtM(p.price)}return"優惠"}
function promoValid(p){switch(p.type){case"amt":return p.min>0&&p.off>0;case"pct":return rateOf(p.rate)<1;case"nfor":return p.n>=2&&p.price>0;case"bxgy":return p.n>=1&&p.m>=1;case"bundle":return(p.items||[]).length>=2&&p.price>0}return false}
function calcPromo(p,units,used,base){const free=i=>!used.has(i),inScope=u=>!p.scope||u.cat===p.scope,take=[];let amt=0;
 const elig=units.map((u,i)=>i).filter(i=>free(i)&&inScope(units[i]));
 if(p.type==="amt"){if(base>=p.min)amt=p.rep?Math.floor(base/p.min)*p.off:p.off}
 else if(p.type==="pct"){const s=elig.reduce((a,i)=>a+units[i].price,0);if(s>0&&!(p.min>0&&s<p.min)){amt=s*(1-rateOf(p.rate));take.push(...elig)}}
 else if(p.type==="nfor"){const n=Math.round(p.n);for(let g=0;g+n<=elig.length;g+=n){const grp=elig.slice(g,g+n),s=grp.reduce((a,i)=>a+units[i].price,0);if(s>p.price){amt+=s-p.price;take.push(...grp)}}}
 else if(p.type==="bxgy"){const n=Math.round(p.n),m=Math.round(p.m);for(let g=0;g+n+m<=elig.length;g+=n+m){const grp=elig.slice(g,g+n+m);grp.slice(n).forEach(i=>amt+=units[i].price);take.push(...grp)}}
 else if(p.type==="bundle"){const avail=elig.slice();while(true){const set=[];for(const id of p.items){const k=avail.findIndex(i=>units[i].pid===id&&!set.includes(i));if(k<0)break;set.push(avail[k])}
   if(set.length!==p.items.length)break;const s=set.reduce((a,i)=>a+units[i].price,0);if(s<=p.price)break;amt+=s-p.price;take.push(...set);set.forEach(i=>avail.splice(avail.indexOf(i),1))}}
 return{amt:Math.max(0,rnd(amt)),take}}
/* ls = cart lines; custom amounts count toward 滿額 but never get item discounts */
function discountFor(ls){const st=S.settings,sub=sumL(ls),units=[];
 ls.forEach(l=>{if(l.p)for(let i=0;i<l.qty;i++)units.push({pid:l.p.id,cat:l.p.cat,price:l.price})});units.sort((a,b)=>b.price-a.price);
 const ps=(st.promos||[]).filter(p=>p.on&&promoValid(p)).sort((a,b)=>PROMO_RANK[a.type]-PROMO_RANK[b.type]);let list=[];
 if(st.promoMode==="stack"){const used=new Set();let base=sub;ps.forEach(p=>{const r=calcPromo(p,units,used,base);if(r.amt>0){list.push({id:p.id,lab:promoName(p),amt:r.amt});r.take.forEach(i=>used.add(i));base-=r.amt}})}
 else{let best=null;ps.forEach(p=>{const r=calcPromo(p,units,new Set(),sub);if(r.amt>0&&(!best||r.amt>best.amt))best={id:p.id,lab:promoName(p),amt:r.amt}});if(best)list=[best]}
 let d=list.reduce((a,x)=>a+x.amt,0);if(d>sub){d=sub}
 return{d,lab:list.map(x=>x.lab).join("、"),list}}

function finishSale(tot,sub,dc){const ls=cartLines();if(!ls.length)return;const st=S.settings,cash=POS.pay==="現金",recv=cash?(POS.recv===""?tot:+POS.recv):tot;

 const s={id:uid("s"),no:st.posNo,t:Date.now(),ev:st.event||"",date:st.date||"",booth:st.booth||"",cur:st.cur,
  lines:ls.map(l=>({pid:l.p?l.p.id:"",name:l.name,sku:l.p?l.p.sku||"":"",qty:l.qty,price:l.price,cost:l.p?num(l.p.cost)||0:0})),
  sub,disc:dc.d,discs:dc.list,evId:curEv().id,total:tot,pay:POS.pay,recv,chg:recv-tot,void:false};
 ls.forEach(l=>{if(l.p)stockMove(l.p,"sale",-l.qty,{sale:s.id,note:"#"+pad3(s.no)})});
 S.sales.unshift(s);POS.last=s;POS.cart={};POS.custom=[];POS.recv="";POS.view="done";changed();drawPos()}
function voidSale(s){if(!s||s.void)return false;if(!confirm("撤銷 #"+pad3(s.no)+"（"+fmtM(s.total)+"）？庫存會加回去。"))return false;

file_() {\nconst id = PropertiesService.getScriptProperties().getProperty(\"fileId\");\nif (id) { try { return DriveApp.getFileById(id); } catch (e) {} }\nconst it = DriveApp.getFilesByName(FILE_NAME);\nreturn it.hasNext() ? it.next() : null;\n}\nfunction out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\n";
/* ---------- 雲端同步 v2：本機先存（離線可用），有網路時一次呼叫就同步到自己的 Google 雲端硬碟 ----------

   S.meta.syncAt   最後同步完成時間；S.meta.cloudRev / cloudUpdated / cloudDevice 上次看到的雲端版本。
   連線碼 = fx1.<Apps Script 部署 ID>.<同步密碼>（一串就能連上，也可以做成 QR code 給 iPhone 掃） */
const CLOUD={url:"",token:"",auto:true,device:"",busy:false,err:"",t:null};
const fmtT=t=>{if(!t)return"—";const d=new Date(t),n=new Date(),hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");return d.toDateString()===n.toDateString()?"今天 "+hm:(d.getFullYear()!==n.getFullYear()?d.getFullYear()+"/":"")+(d.getMonth()+1)+"/"+d.getDate()+" "+hm};
const cloudOn=()=>!!(CLOUD.url&&CLOUD.token);
/* local changes not in the cloud yet; a device that edited but never synced counts as changed */
const dirty=()=>{const m=S.meta||{};return(m.updated||0)>(m.synced||0)&&(!!m.cloudRev||(m.updated||0)>0)};

async function cloudCall(body){

 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),90000);
 try{const r=await fetch(CLOUD.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({token:CLOUD.token,device:CLOUD.device},body)),redirect:"follow",credentials:"omit",cache:"no-store",referrerPolicy:"no-referrer",signal:ctl.signal});

 S.meta=Object.assign(S.meta||{},{updated:j.updated||Date.now(),synced:j.updated||Date.now(),syncAt:Date.now(),cloudRev:j.rev,cloudUpdated:j.updated,cloudDevice:j.device||""});

/* one request per sync: the server either says "same", sends newer data, saves ours, or reports a conflict */
async function cloudSync(mode){if(CLOUD.busy)return;
 if(!cloudOn()){if(mode!=="auto")openCloud();return}
 if(!navigator.onLine){updBadge();if(mode!=="auto")toast("目前離線：資料已存在這台裝置，有網路後會自動同步");return}
 CLOUD.busy=true;CLOUD.err="";updBadge();
 try{const m=S.meta||(S.meta={}),u0=m.updated||Date.now(),local=mode==="push"||dirty();
  let j=mode==="pull"?await cloudCall({op:"pull"}):await cloudCall({op:"sync",rev:m.cloudRev||0,dirty:local,force:mode==="push",updated:u0,data:local?JSON.stringify(S):undefined});
  if(j.same&&!j.rev&&S.products.length)j=await cloudCall({op:"sync",rev:0,dirty:true,updated:u0,data:JSON.stringify(S)});
  if(j.conflict){const other=j.device&&j.device!==CLOUD.device?"（"+j.device+"）":"";
   if(confirm("本機和雲端都有新的修改：\n・這台裝置："+fmtT(m.updated)+"\n・雲端"+other+"："+fmtT(j.updated)+"\n\n按「確定」＝改用雲端版本（這台的資料會先備份）\n按「取消」＝用這台的資料覆蓋雲端"))j=await cloudCall({op:"pull"});
   else j=await cloudCall({op:"sync",rev:j.rev,dirty:true,force:true,updated:u0,data:JSON.stringify(S)})}
  if(j.saved){Object.assign(m,{synced:u0,syncAt:Date.now(),cloudRev:j.rev,cloudUpdated:j.updated,cloudDevice:CLOUD.device});if(DB.db)await DB.set("state",S);if(mode!=="auto")toast("已上傳到雲端")}
  else if(j.data){await applyCloud(j);toast("已載入雲端資料（"+fmtT(j.updated)+"）")}
  else if(j.same){Object.assign(m,{syncAt:Date.now(),cloudUpdated:j.updated,cloudDevice:j.device||m.cloudDevice||""});if(DB.db)await DB.set("state",S);if(mode!=="auto")toast("已是最新")}
  else if(mode==="pull")throw new Error("雲端還沒有資料")}

 finally{CLOUD.busy=false;updBadge()}}
